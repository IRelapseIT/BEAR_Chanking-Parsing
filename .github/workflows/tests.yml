name: BEAR regression
on: [push, pull_request]
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-py312-tested.txt -e "./bear-text-beta[dev]" -e "./bear-fusion-lab[demo,acceptance]"
      - run: python -m pip check
      - run: bear doctor
      - run: python -m pytest bear-text-beta/tests -q
      - run: python -m pytest bear-fusion-lab/tests -q
  tokenizer-integration:
    runs-on: ubuntu-latest
    env:
      BEAR_TEST_TOKENIZER: ${{ github.workspace }}/test-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c constraints-py312-tested.txt -e "./bear-text-beta[dev]" -e "./bear-fusion-lab[demo,acceptance]"
      - run: bear --model-dir "$BEAR_TEST_TOKENIZER" prepare-model
      - run: bear --model-dir "$BEAR_TEST_TOKENIZER" doctor --require-model
      - run: python -m pytest bear-text-beta/tests -q
      - run: python -m pytest bear-fusion-lab/tests -q
