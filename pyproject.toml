[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bear-pdf-ocr"
version = "0.1.0"
description = "Standalone BEAR PDF parser and OCR pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber==0.11.10",
    "pypdfium2==5.14.0",
    "Pillow==13.0.0",
    "psutil==7.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "reportlab==5.1.0"]

[project.scripts]
bear-pdf-ocr = "bear_pdf_ocr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
